[versions]
app = "3.0.10"
minSdk = "26"
targetSdk = "34"

# build plugins
plugin-android = "8.3.1"
plugin-firebase-crashlytics = "2.9.9"
plugin-google_services = "4.4.1"
plugin-android-junit5 = "1.8.2.1"
plugin-versions = "0.45.0"
plugin-ksp = "1.9.23-1.0.20"

# android
androidx-appcompat = "1.6.1"
androidx-card_view = "1.0.0"
androidx-collection = "1.4.0"
androidx-constraint_layout = "2.1.4"
androidx-core = "1.12.0"
androidx-browser = "1.8.0"
androidx-fragment = "1.6.2"
androidx-lifecycle-core = "2.7.0"
androidx-lifecycle-extensions = "2.2.0"
google-material = "1.11.0"
androidx-paging = "3.2.1"
androidx-preference = "1.2.1"
androidx-recycler_view = "1.3.2"
android-desugar_jdk_libs = "2.0.4"

# google
firebase-bom = "32.8.0"

# kotlin
kotlin-coroutines = "1.8.0"
kotlin-bom = "1.9.23"

# networking
moshi = "1.15.1"
okhttp = "4.12.0"
retrofit = "2.11.0"

# testing
junit-android-test = "1.4.0"
junit-jupiter = "5.10.2"
mockk = "1.13.10"
androidx-test-runner = "1.5.2"

# logging
slf4j-timber = "3.1"
timber = "5.0.1"

# support
koin = "3.5.4"
scribejava = "8.3.3"
material_dialogs = "3.3.0"

locus_api = "0.9.52"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recycler_view" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidx-card_view" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraint_layout" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle-core" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle-core" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "androidx-lifecycle-extensions" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version.ref = "androidx-collection" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "androidx-paging" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "android-desugar_jdk_libs" }
google-material = { module = "com.google.android.material:material", version.ref = "google-material" }

# kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-bom" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }

# koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Locus API
locus-android = { module = "com.asamm:locus-api-android", version.ref = "locus_api" }

# Logging API
logging-slf4j-timber = { module = "com.arcao:slf4j-timber", version.ref = "slf4j-timber" }
logging-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Material dialogs
material-dialogs-core = { module = "com.afollestad.material-dialogs:core", version.ref = "material_dialogs" }
material-dialogs-input = { module = "com.afollestad.material-dialogs:input", version.ref = "material_dialogs" }

# Crashlytics & Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }

# OkHTTP
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-logging_interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }

# moshi
moshi-core = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }

# scribe java
scribejava-core = { module = "com.github.scribejava:scribejava-core", version.ref = "scribejava" }
scribejava-okhttp = { module = "com.github.scribejava:scribejava-httpclient-okhttp", version.ref = "scribejava" }

# testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-android-test-core = { module = "de.mannodermaus.junit5:android-test-core", version.ref = "junit-android-test" }
junit-android-test-runner = { module = "de.mannodermaus.junit5:android-test-runner", version.ref = "junit-android-test" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "plugin-android" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-bom" }
versions = { id = "com.github.ben-manes.versions", version.ref = "plugin-versions" }
google-services = { id = "com.google.gms.google-services", version.ref = "plugin-google_services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "plugin-firebase-crashlytics" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "plugin-android-junit5" }
ksp = { id = "com.google.devtools.ksp", version.ref = "plugin-ksp" }